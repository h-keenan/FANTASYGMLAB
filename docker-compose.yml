# FantasyDesk — self-hosted stack.
#
# Replicates render.yaml's real (non-cron) services plus a Caddy reverse
# proxy with automatic HTTPS. The stripe-webhook and revenuecat-webhook
# services were RETIRED from this stack on 2026-10-24: billing and
# entitlement processing now runs on Supabase Edge Functions (see
# docs/billing-on-supabase.md, which also has the rollback recipe). The legacy Streamlit `web` service (app.py)
# was removed in 2026-10 -- see docs/streamlit-removal-2026-10.md.
# The 4 cron jobs in render.yaml
# (push-trigger sweep, trade-outcome-result sweep, players-db refresh,
# injury-status sync) are deliberately NOT part of this stack — they are
# being migrated to GitHub Actions in a separate PR and will not run on
# this box. See docs/SELF_HOSTED_MIGRATION.md.
#
# All Python app services are built from the same image (./Dockerfile) and
# differ only in `command:`, copied verbatim from each service's
# render.yaml startCommand. Secrets are never set here directly — every
# service reads from `.env` (gitignored; see .env.example for every
# required variable name, mapped to its Render dashboard source).
#
# Per-service resource limits (`mem_limit`/`cpus` below): on Render, every
# service got its own isolated instance, so one runaway service could not
# starve another. Colocating all four containers (mobile-api, redis, web-next, caddy) on one shared box removes
# that isolation — a leak or a CPU-bound spike (pandas/Monte Carlo work in
# `mobile-api`) in one container could otherwise exhaust the host's
# RAM/CPU and take the others down with it. `mem_limit`/`cpus` are the
# plain (non-`deploy.resources`) Compose fields, which is deliberate: the
# `deploy.resources.limits` key is only enforced by `docker stack deploy`
# (Swarm), not by plain `docker compose up`, which is what this stack
# actually runs (see docs/SELF_HOSTED_MIGRATION.md and
# deploy/systemd/fantasygmlab.service).
#
# Sized for the target box at 16GB RAM / 6-core / 12-thread (per coridian_'s
# latest hardware spec for this migration — NOTE: this supersedes an older
# "4-core/8-thread" figure still referenced in some comments/docs below and
# in tests/test_self_hosted_resource_isolation.py's prior version; flagging
# for coridian_ to confirm the 6c/12t figure is the real, current box before
# this ships, since the whole mobile-api worker-count/resource sizing below
# is derived from it): `mobile-api` does the real pandas/Monte
# Carlo/player-cache work, so it gets the largest share; `redis` is a
# small, fast in-memory state store (not a database) so it needs very
# little; Caddy just proxies. (The two small Stripe/RevenueCat webhook
# containers, 0.5g / 0.5 cpu each, were retired -- that headroom is now
# simply unallocated.)
#
# `mobile-api` specifically now runs multiple uvicorn worker processes
# (see its own command/comment below) instead of one, which is why its
# mem_limit/cpus grew substantially from the single-worker figures this
# file used to carry: each worker is a separate Python process with its own
# copy of every in-process-only structure that ISN'T in Redis — most
# notably the warmed `rankings.load_players` player table (pandas
# DataFrame), which this migration deliberately did NOT move to Redis (out
# of scope — only the rate limiter and the three single-flight caches
# moved there). So memory scales roughly linearly with worker count for
# that piece, even though Redis now means the trade-hub/league-rankings/
# playoff-odds caches are NOT duplicated per worker the way they used to
# be.
#
# Total mem_limit across the remaining production-path services
# (mobile-api 7g + redis 256m + caddy 256m) is ~7.5GB of this box's 16GB
# and ~4.75 cpus (the removed Streamlit `web` service used to take 5g / 3.0
# cpus, and the two retired webhook services 1g / 1.0 cpu combined), so
# host headroom is larger than the historical ~2.5GB / ~3.25 threads below.
# These are ceilings, not reservations, so normal (non-spiking) operation
# is unaffected — they only bound the worst case. Sign-off note: this is a
# real production resource-limit change (new, not tightening something
# that worked before) — flagging for coridian_ to confirm before this
# ships to the actual box, even though the values themselves are
# deliberately conservative (safe headroom, not tight enough to cause
# normal-load throttling) given the stated 6c/12t spec.
#
# `web-next` (below, added after the above budget was last signed off) is
# NOT counted in that ~7.5GB/~4.75-CPU total — it's an additive,
# test-subdomain-only preview service, not part of the production traffic
# path (see its own service comment and docs/SELF_HOSTED_MIGRATION.md).
# Its 1g/1.0 is sized independently against the box's existing headroom
# (~2.5GB/~3.25 threads); re-run the whole-stack sizing math above if/when
# web-next becomes the real production frontend.

services:
  mobile-api:
    build:
      context: .
      dockerfile: Dockerfile
      # Baked into the image (see Dockerfile) rather than passed as a
      # runtime `environment:` var, so modules/build_identity.py keeps
      # reporting the right commit/timestamp across a container restart
      # that doesn't go through deploy/release_deploy.sh — e.g. the
      # systemd unit's `docker compose up -d` on every host boot, which
      # has no shell env set at all. deploy/release_deploy.sh exports both
      # from the commit it's about to build right before
      # `docker compose build`; `:-local`/empty only applies to a manual
      # `docker compose build` run outside that script.
      args:
        DYNASTYGM_BUILD: ${DYNASTYGM_BUILD:-local}
        DYNASTYGM_DEPLOYED_AT: ${DYNASTYGM_DEPLOYED_AT:-}
    image: fantasygmlab-app:latest
    # NOTE: command must go through a shell ("sh -c") for $PORT to expand —
    # Compose's bare string/list command form is argv-exec'd directly (no
    # shell), so a literal "$PORT" argument would otherwise be passed
    # through unexpanded. The doubled "$$" escapes Compose's own
    # variable-interpolation pass over this file so a literal "$PORT"
    # reaches the container's sh, which then expands it from `environment:`
    # below.
    #
    # Now runs multiple uvicorn worker PROCESSES (`--workers`) to actually
    # use the box's cores under concurrent load — previously pinned to one
    # worker because this service kept two pieces of state in process
    # memory that were not shared across processes:
    #   1. `_rate_limiter` (was an in-memory fixed-window counter). With N
    #      worker processes and no shared store, the *effective* per-client
    #      limit silently becomes limit*N instead of limit — a correctness
    #      regression, not just a perf tradeoff.
    #   2. The three `@lru_cache` + per-process `threading.Lock`
    #      single-flight caches (modules.trade_hub_engine,
    #      modules.league_rankings x2, modules.playoff_simulator): under N
    #      workers each kept its own separate cache/lock, so the same
    #      expensive computation (e.g. Trade Hub's ~150-300ms idea-
    #      generation pass) could still run redundantly across workers, and
    #      a cache hit in worker A never helped a request landing on
    #      worker B.
    # Both are now backed by Redis (see the `redis` service below and
    # modules/redis_cache.py) instead of per-process memory, so every
    # worker shares one counter and one cache/lock per key — this is what
    # makes `--workers` safe here, not just desirable. `depends_on` below
    # requires `redis` to report healthy before this service starts, since
    # neither piece of state has a non-Redis fallback path other than
    # failing open (see modules/redis_cache.py's module docstring) --
    # correct, but not the steady-state this should run in.
    #
    # MOBILE_API_WORKERS defaults to 4: on the stated 6-core/12-thread box,
    # that leaves caddy's 0.5 and redis' 0.25 (plus web-next's 1.0) all
    # still fitting comfortably under the
    # 12 logical threads with real headroom (see this file's top-of-file
    # resource-limit comment for the full budget) -- override via `.env`
    # if the actual box differs from that spec.
    command: ["sh", "-c", "uvicorn services.mobile_api_service:app --host 0.0.0.0 --port $$PORT --workers $$MOBILE_API_WORKERS"]
    environment:
      PORT: "8080"
      MOBILE_API_WORKERS: "${MOBILE_API_WORKERS:-4}"
      # Render sets its own RENDER/RENDER_SERVICE_ID/RENDER_EXTERNAL_URL
      # markers automatically; nothing does that here. Without this,
      # modules/app_config.py's is_managed_cloud_host() cannot tell this
      # production box apart from a contributor's local checkout, which
      # silently disables the managed-host config safety net and unlocks
      # customer-unsafe debug/premium-override switches by default. See
      # docs/SELF_HOSTED_MIGRATION.md.
      DYNASTYGM_SELF_HOSTED: "1"
    env_file:
      - .env
    # See this file's top-of-file resource-limit comment for the full
    # reasoning: scaled up from the old single-worker 4g/2.0 to cover N
    # worker processes, each with its own copy of the warmed player-table
    # cache (not moved to Redis by this change) plus Python/library
    # overhead, while Redis absorbs the trade-hub/league-rankings/
    # playoff-odds caches that used to also duplicate per worker.
    mem_limit: 7g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  redis:
    # Official slim image — this is a simple shared state store (rate
    # limiter counters + three ~30s-TTL single-flight caches, all disposable
    # and cheap to regenerate), not a database holding data of record, so
    # no persistence volume is configured on purpose: a restart losing this
    # container's contents just means every worker briefly recomputes/
    # re-counts from scratch, which is exactly the safe fail-open/fail-cold
    # behavior modules/redis_cache.py and services/mobile_api_service.py's
    # rate limiter are already built to tolerate.
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal

  # web-next: the Next.js frontend (web-next/). Routed by the Caddyfile from
  # {$APP_DOMAIN}, {$WEB_NEXT_DOMAIN} and fantasydesk.app (the legacy
  # Streamlit `web` service that used to serve {$APP_DOMAIN} was removed in
  # 2026-10 -- see docs/streamlit-removal-2026-10.md).
  web-next:
    build:
      context: .
      dockerfile: web-next/Dockerfile
      # Baked into the client JS bundle at build time, not read at runtime
      # — see web-next/Dockerfile's header comment. Compose interpolates
      # these ${VAR} references from `.env` the same way it already does
      # for DYNASTYGM_BUILD/DYNASTYGM_DEPLOYED_AT above, and forwards them
      # as Dockerfile ARGs into the image build.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    image: fantasygmlab-web-next:latest
    # No "sh -c"/doubled "$$PORT" trick needed here (unlike the Python
    # services above) — `next start` reads PORT directly from its process
    # environment, it isn't passed as a shell-expanded CLI flag.
    command: ["npm", "run", "start"]
    environment:
      PORT: "8080"
    env_file:
      - .env
    # web-next calls services/mobile_api_service.py entirely from the
    # USER'S BROWSER, not from this container: every page is a client
    # component (`"use client"`) that calls src/lib/api.ts's
    # authorizedRequest from a useEffect, reading NEXT_PUBLIC_API_BASE_URL
    # — which is itself baked into the browser bundle at build time (see
    # build.args above), not resolved at request time. So this container
    # never makes a server-side call to `mobile-api`, and an internal
    # Docker-network hostname (e.g. http://mobile-api:8080) would not be
    # reachable from the browser anyway — NEXT_PUBLIC_API_BASE_URL must be
    # the real public https://api.fantasygmlab.com, same as any other
    # browser client of that API. That's also why there's no
    # `depends_on: mobile-api` below: this service has no runtime
    # dependency on it, only a build-time one baked into the bundle.
    #
    # A Next.js SSR server for this app is much lighter than the Python
    # services: no pandas/Monte Carlo work, no warmed player-table cache,
    # and a single `next start` process serves every request statelessly
    # (no per-session in-process state the way Streamlit's `st.session_state`
    # has — auth session state lives in the browser via Supabase, not here).
    # 1g/1.0 is deliberately modest headroom for Node's baseline footprint
    # plus concurrent SSR request handling, not sized against any real
    # measured load yet (there is none — this is a test-subdomain preview).
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static/landing:/srv/static/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # condition: service_healthy (not the bare list form) so Caddy starts
    # proxying only once each app container's own healthcheck above passes,
    # not merely once the container process has started — `mobile-api` in
    # particular spends real time on cold imports/pip-installed deps before
    # /health responds, and Caddy proxying to it too early produces
    # exactly the kind of partially-broken first-load experience ("page up,
    # but pieces of it fail") this stack should not risk on every restart.
    depends_on:
      mobile-api:
        condition: service_healthy
      web-next:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
