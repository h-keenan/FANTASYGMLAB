# FantasyGM Lab — self-hosted stack.
#
# Replicates render.yaml's four real (non-cron) services plus a Caddy
# reverse proxy with automatic HTTPS. The 4 cron jobs in render.yaml
# (push-trigger sweep, trade-outcome-result sweep, players-db refresh,
# injury-status sync) are deliberately NOT part of this stack — they are
# being migrated to GitHub Actions in a separate PR and will not run on
# this box. See docs/SELF_HOSTED_MIGRATION.md.
#
# All four app services are built from the same image (./Dockerfile) and
# differ only in `command:`, copied verbatim from each service's
# render.yaml startCommand. Secrets are never set here directly — every
# service reads from `.env` (gitignored; see .env.example for every
# required variable name, mapped to its Render dashboard source).
#
# Per-service resource limits (`mem_limit`/`cpus` below): on Render, every
# service got its own isolated instance, so one runaway service could not
# starve another. Colocating all six containers on one shared box removes
# that isolation — a leak or a CPU-bound spike (pandas/Monte Carlo work in
# `web` or `mobile-api`) in one container could otherwise exhaust the host's
# RAM/CPU and take the others down with it. `mem_limit`/`cpus` are the
# plain (non-`deploy.resources`) Compose fields, which is deliberate: the
# `deploy.resources.limits` key is only enforced by `docker stack deploy`
# (Swarm), not by plain `docker compose up`, which is what this stack
# actually runs (see docs/SELF_HOSTED_MIGRATION.md and
# deploy/systemd/fantasygmlab.service).
#
# Sized for the target box at 16GB RAM / 6-core / 12-thread (per coridian_'s
# latest hardware spec for this migration — NOTE: this supersedes an older
# "4-core/8-thread" figure still referenced in some comments/docs below and
# in tests/test_self_hosted_resource_isolation.py's prior version; flagging
# for coridian_ to confirm the 6c/12t figure is the real, current box before
# this ships, since the whole mobile-api worker-count/resource sizing below
# is derived from it): `web` and `mobile-api` do the real pandas/Monte
# Carlo/player-cache work, so they get the largest share; `redis` is a
# small, fast in-memory state store (not a database) so it needs very
# little; the two webhook services only handle occasional small
# Stripe/RevenueCat POSTs; Caddy just proxies.
#
# `mobile-api` specifically now runs multiple uvicorn worker processes
# (see its own command/comment below) instead of one, which is why its
# mem_limit/cpus grew substantially from the single-worker figures this
# file used to carry: each worker is a separate Python process with its own
# copy of every in-process-only structure that ISN'T in Redis — most
# notably the warmed `rankings.load_players` player table (pandas
# DataFrame), which this migration deliberately did NOT move to Redis (out
# of scope — only the rate limiter and the three single-flight caches
# moved there). So memory scales roughly linearly with worker count for
# that piece, even though Redis now means the trade-hub/league-rankings/
# playoff-odds caches are NOT duplicated per worker the way they used to
# be.
#
# `web` got a smaller, single-process bump instead of the same `--workers`
# treatment: Streamlit is a single reactive server process per instance —
# there's no `--workers N` flag the way uvicorn has, because a Streamlit
# process keeps every open browser session's widget/script-rerun state
# (`st.session_state`) in its own process memory, not in a shared store.
# Splitting `web` across N Streamlit processes was evaluated and rejected
# for this change (see the `web` service's own comment below for the
# full reasoning) — it would need sticky, session-affine routing at Caddy
# PLUS moving `st.session_state` out of process memory, which is a real
# architecture project, not a resource-limit tweak; left as a follow-up for
# a human to scope separately. So `web` still only ever uses one core's
# worth of raw Python/GIL-bound execution at a time per request, same as
# `mobile-api` did pre-migration — its bump below is sized for the real
# pandas/numpy work (which *can* use extra threads/memory within that one
# process, e.g. BLAS-backed vector ops and holding bigger Monte
# Carlo/player-table arrays) and for give multiple concurrent browser
# sessions more headroom, not for added parallelism the process can't use.
#
# Total mem_limit across all six is now ~13.5GB of this box's 16GB,
# leaving ~2.5GB headroom for the host OS/Docker itself; total cpus is
# ~8.75 of the 12 logical threads, leaving ~3.25 threads of headroom.
# These are ceilings, not reservations, so normal (non-spiking) operation
# is unaffected — they only bound the worst case. Sign-off note: this is a
# real production resource-limit change (new, not tightening something
# that worked before) — flagging for coridian_ to confirm before this
# ships to the actual box, even though the values themselves are
# deliberately conservative (safe headroom, not tight enough to cause
# normal-load throttling) given the stated 6c/12t spec.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fantasygmlab-app:latest
    # NOTE: command must go through a shell ("sh -c") for $PORT to expand —
    # Compose's bare string/list command form is argv-exec'd directly (no
    # shell), so a literal "$PORT" argument would otherwise be passed
    # through unexpanded. The doubled "$$" escapes Compose's own
    # variable-interpolation pass over this file so a literal "$PORT"
    # reaches the container's sh, which then expands it from `environment:`
    # below — mirroring exactly how Render's platform invokes startCommand
    # through a shell.
    command: ["sh", "-c", "streamlit run app.py --server.address 0.0.0.0 --server.port $$PORT --server.headless true"]
    environment:
      PORT: "8080"
      # Render sets its own RENDER/RENDER_SERVICE_ID/RENDER_EXTERNAL_URL
      # markers automatically; nothing does that here. Without this,
      # modules/app_config.py's is_managed_cloud_host() cannot tell this
      # production box apart from a contributor's local checkout, which
      # silently disables the managed-host config safety net (missing
      # Supabase config fails open instead of fail-closed with a clear
      # st.error()) and unlocks customer-unsafe debug/premium-override
      # switches by default. See docs/SELF_HOSTED_MIGRATION.md.
      DYNASTYGM_SELF_HOSTED: "1"
      # Render set RENDER_GIT_COMMIT automatically; nothing does that here,
      # so modules/build_identity.py's resolve_build_identity() always fell
      # back to "local" on this box — meaning the app's own "Build …"
      # footer silently lied about every self-hosted deploy being an
      # uncommitted local run. deploy/release_deploy.sh exports this from
      # the actual commit it just deployed right before `docker compose up
      # -d`; `:-local` only applies if that script wasn't used to deploy.
      DYNASTYGM_BUILD: ${DYNASTYGM_BUILD:-local}
    env_file:
      - .env
    # Bumped from the old single-process 4g/2.0 (see this file's top-of-file
    # resource-limit comment for the full box budget) — `web` does the same
    # class of real pandas/Monte Carlo work `mobile-api` does (playoff odds,
    # league rankings, trade hub ideas, the player table itself), so it was
    # under-provisioned relative to `mobile-api`'s post-migration 7g/4.0 even
    # though it never got the `--workers` treatment.
    #
    # Streamlit has no documented way to run multiple server processes
    # behind one shared port the way uvicorn's `--workers` does for
    # `mobile-api`: a Streamlit process keeps every open browser tab's
    # `st.session_state` in its own process memory (there is no shared
    # session store), and Streamlit's own deployment docs only describe
    # running one process per app instance. Running 2 Streamlit processes
    # behind Caddy would need (a) Caddy's cookie-based sticky-session load
    # balancing so a given browser tab's HTTP AND WebSocket (Streamlit's
    # live-rerun channel) traffic always lands on the same backend process —
    # without that, a session landing on "the other" process mid-session
    # would hit a process that has never seen its session_state and would
    # silently reset the user's whole app state — and (b) auditing every
    # existing `st.session_state`/module-level cache usage in this app for
    # anything that implicitly assumes a single shared process (e.g.
    # anything cached at import time rather than per-session or in Redis).
    # That is a real session-state/architecture project, not a resource-
    # limit tweak, so it was deliberately NOT attempted here — this is the
    # resource-bump-only fix, with a note for a human to decide whether true
    # horizontal Streamlit scaling is worth a dedicated follow-up.
    #
    # Sized against the box's remaining budget after the other five
    # services (see top-of-file comment): mem 5g (was 4g) keeps the total
    # at ~13.5GB of 16GB, ~2.5GB headroom for the host; cpus 3.0 (was 2.0)
    # keeps total cpus at ~8.75 of 12 logical threads, ~3.25 threads of
    # headroom. Smaller than mobile-api's jump (4g->7g, 2.0->4.0) on
    # purpose: mobile-api's bump covers 4 separate worker PROCESSES, each
    # with its own copy of in-memory state, while `web` is still exactly
    # one process — the extra room here is for bigger in-process data
    # (Monte Carlo trial arrays, the warmed player table, concurrent
    # browser sessions' own state), not for added parallelism the process
    # can't use.
    mem_limit: 5g
    cpus: 3.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # `web` also calls into modules/league_rankings.py and
    # modules/trade_hub_engine.py, both of which now route through
    # modules/redis_cache.redis_single_flight_cache (see the `mobile-api`
    # service's Redis migration comment below). Without this, `web` can
    # start serving requests before Redis's healthcheck passes, and every
    # affected cache call pays its ~0.5s socket_connect_timeout/
    # socket_timeout before falling back uncached on each stack restart.
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  mobile-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fantasygmlab-app:latest
    # See the "web" service's command comment above for why this is
    # wrapped in sh -c and uses the doubled "$$PORT"/"$$MOBILE_API_WORKERS".
    #
    # Now runs multiple uvicorn worker PROCESSES (`--workers`) to actually
    # use the box's cores under concurrent load — previously pinned to one
    # worker because this service kept two pieces of state in process
    # memory that were not shared across processes:
    #   1. `_rate_limiter` (was an in-memory fixed-window counter). With N
    #      worker processes and no shared store, the *effective* per-client
    #      limit silently becomes limit*N instead of limit — a correctness
    #      regression, not just a perf tradeoff.
    #   2. The three `@lru_cache` + per-process `threading.Lock`
    #      single-flight caches (modules.trade_hub_engine,
    #      modules.league_rankings x2, modules.playoff_simulator): under N
    #      workers each kept its own separate cache/lock, so the same
    #      expensive computation (e.g. Trade Hub's ~150-300ms idea-
    #      generation pass) could still run redundantly across workers, and
    #      a cache hit in worker A never helped a request landing on
    #      worker B.
    # Both are now backed by Redis (see the `redis` service below and
    # modules/redis_cache.py) instead of per-process memory, so every
    # worker shares one counter and one cache/lock per key — this is what
    # makes `--workers` safe here, not just desirable. `depends_on` below
    # requires `redis` to report healthy before this service starts, since
    # neither piece of state has a non-Redis fallback path other than
    # failing open (see modules/redis_cache.py's module docstring) --
    # correct, but not the steady-state this should run in.
    #
    # MOBILE_API_WORKERS defaults to 4: on the stated 6-core/12-thread box,
    # that leaves `web`'s 2 cores, the two webhooks' 1 combined core,
    # caddy's 0.5, and redis' 0.25 all still fitting comfortably under the
    # 12 logical threads with real headroom (see this file's top-of-file
    # resource-limit comment for the full budget) -- override via `.env`
    # if the actual box differs from that spec.
    command: ["sh", "-c", "uvicorn services.mobile_api_service:app --host 0.0.0.0 --port $$PORT --workers $$MOBILE_API_WORKERS"]
    environment:
      PORT: "8080"
      MOBILE_API_WORKERS: "${MOBILE_API_WORKERS:-4}"
      # See the "web" service's DYNASTYGM_SELF_HOSTED comment above.
      DYNASTYGM_SELF_HOSTED: "1"
      # See the "web" service's DYNASTYGM_BUILD comment above.
      DYNASTYGM_BUILD: ${DYNASTYGM_BUILD:-local}
    env_file:
      - .env
    # See this file's top-of-file resource-limit comment for the full
    # reasoning: scaled up from the old single-worker 4g/2.0 to cover N
    # worker processes, each with its own copy of the warmed player-table
    # cache (not moved to Redis by this change) plus Python/library
    # overhead, while Redis absorbs the trade-hub/league-rankings/
    # playoff-odds caches that used to also duplicate per worker.
    mem_limit: 7g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  redis:
    # Official slim image — this is a simple shared state store (rate
    # limiter counters + three ~30s-TTL single-flight caches, all disposable
    # and cheap to regenerate), not a database holding data of record, so
    # no persistence volume is configured on purpose: a restart losing this
    # container's contents just means every worker briefly recomputes/
    # re-counts from scratch, which is exactly the safe fail-open/fail-cold
    # behavior modules/redis_cache.py and services/mobile_api_service.py's
    # rate limiter are already built to tolerate.
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal

  stripe-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    image: fantasygmlab-app:latest
    # See the "web" service's command comment above for why this is
    # wrapped in sh -c and uses the doubled "$$PORT".
    command: ["sh", "-c", "uvicorn services.stripe_webhook_service:app --host 0.0.0.0 --port $$PORT"]
    environment:
      PORT: "8080"
      # See the "web" service's DYNASTYGM_SELF_HOSTED comment above.
      DYNASTYGM_SELF_HOSTED: "1"
    env_file:
      - .env
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  revenuecat-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    image: fantasygmlab-app:latest
    # See the "web" service's command comment above for why this is
    # wrapped in sh -c and uses the doubled "$$PORT".
    command: ["sh", "-c", "uvicorn services.revenuecat_webhook_service:app --host 0.0.0.0 --port $$PORT"]
    environment:
      PORT: "8080"
      # See the "web" service's DYNASTYGM_SELF_HOSTED comment above.
      DYNASTYGM_SELF_HOSTED: "1"
    env_file:
      - .env
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static/landing:/srv/static/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # condition: service_healthy (not the bare list form) so Caddy starts
    # proxying only once each app container's own healthcheck above passes,
    # not merely once the container process has started — `web` in
    # particular spends real time on cold imports/pip-installed deps before
    # /_stcore/health responds, and Caddy proxying to it too early produces
    # exactly the kind of partially-broken first-load experience ("page up,
    # but pieces of it fail") this stack should not risk on every restart.
    depends_on:
      web:
        condition: service_healthy
      mobile-api:
        condition: service_healthy
      stripe-webhook:
        condition: service_healthy
      revenuecat-webhook:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
