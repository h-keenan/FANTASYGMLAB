services:
  # Primary Streamlit application. For Founder Beta, this service MUST remain
  # always-on (paid instance that does not sleep). Free/sleeping plans make
  # cold first-paint 10–15+ seconds before Python starts — that delay cannot
  # be fixed in application code. See:
  # docs/production-first-paint-and-framework-viability.md
  #
  # Recommended topology (manual DNS / hosting Ops):
  #   fantasygmlab.com / www → static/landing (no Python)
  #   app.fantasygmlab.com   → this Streamlit service
  # Until DNS split is live, this service may still own the apex hostname.
  - type: web
    name: fantasygm-lab
    branch: main
    runtime: python
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_BASE_URL
        value: https://fantasygmlab.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ANNUAL
        sync: false
      - key: STRIPE_CUSTOMER_PORTAL_RETURN_URL
        sync: false
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        sync: false
      - key: STRIPE_CHECKOUT_CANCEL_URL
        sync: false
      - key: DYNASTYGM_BUILD
        sync: false
      - key: DYNASTYGM_SHOW_EXPERIMENTAL
        sync: false
  # Optional static marketing site (activate manually when DNS split is ready).
  # Do not point health checks at Streamlit for the marketing hostname.
  # - type: web
  #   name: fantasygm-lab-marketing
  #   runtime: static
  #   staticPublishPath: ./static/landing
  #   buildCommand: python scripts/build_static_landing_assets.py
  - type: web
    # Dedicated Stripe Test Mode webhook. If this hostname returns
    # x-render-routing: no-server, the Blueprint service was never created —
    # apply/sync render.yaml or create the web service manually (see
    # docs/stripe-webhook-service-contract.md).
    name: fantasygm-lab-stripe-webhook
    branch: main
    runtime: python
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.stripe_webhook_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
