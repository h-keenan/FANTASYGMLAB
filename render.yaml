services:
  # Always-on Streamlit application (app.fantasygmlab.com).
  # Free/sleeping plans cause 10–15+ s cold first-paint before Python starts.
  # Founder Ops must select a paid always-on instance type in the Render
  # dashboard — Blueprint cannot set billing plan.
  - type: web
    name: fantasygm-lab
    branch: main
    runtime: python
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_BASE_URL
        value: https://app.fantasygmlab.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_BILLING_MODE
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ANNUAL
        sync: false
      - key: STRIPE_CUSTOMER_PORTAL_RETURN_URL
        sync: false
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        sync: false
      - key: STRIPE_CHECKOUT_CANCEL_URL
        sync: false
      - key: DYNASTYGM_BUILD
        sync: false
      - key: DYNASTYGM_SHOW_EXPERIMENTAL
        sync: false
  # Static marketing landing (fantasygmlab.com).
  # After Blueprint sync: attach custom domains fantasygmlab.com + www,
  # then remove those domains from the Streamlit service so auth/session
  # has a single app origin (app.fantasygmlab.com).
  - type: web
    name: fantasygm-lab-marketing
    branch: main
    runtime: static
    autoDeploy: true
    buildCommand: python scripts/build_static_landing_assets.py
    staticPublishPath: ./static/landing
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
  - type: web
    # Dedicated Stripe Test Mode webhook. If this hostname returns
    # x-render-routing: no-server, the Blueprint service was never created —
    # apply/sync render.yaml or create the web service manually (see
    # docs/stripe-webhook-service-contract.md).
    name: fantasygm-lab-stripe-webhook
    branch: main
    runtime: python
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.stripe_webhook_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_BILLING_MODE
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ANNUAL
        sync: false
