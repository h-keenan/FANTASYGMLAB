# Copy this file to local_secrets/secrets.toml for local development.
# Keep real values out of GitHub.
#
# Production canonical app origin: https://app.fantasygmlab.com
# Marketing origin: https://fantasygmlab.com
# Do not point production Stripe/auth returns at apex/www after domain cutover.

[app]
APP_BASE_URL = "http://localhost:8501"
DYNASTYGM_BUILD = "local"

[supabase]
SUPABASE_URL = "REPLACE_ME"
SUPABASE_ANON_KEY = "REPLACE_ME"

[stripe]
STRIPE_SECRET_KEY = "sk_test_REPLACE_ME"
STRIPE_PRICE_MONTHLY = "price_REPLACE_ME"
STRIPE_PRICE_ANNUAL = "price_REPLACE_ME"
# Production values must use https://app.fantasygmlab.com/… (not apex/www).
STRIPE_CUSTOMER_PORTAL_RETURN_URL = "http://localhost:8501/?page=premium"
STRIPE_CHECKOUT_SUCCESS_URL = "http://localhost:8501/?page=premium&checkout=success"
STRIPE_CHECKOUT_CANCEL_URL = "http://localhost:8501/?page=premium&checkout=cancel"

[backend_only]
STRIPE_WEBHOOK_SECRET = "whsec_REPLACE_ME"
SUPABASE_SERVICE_ROLE_KEY = "REPLACE_ME"

[local_flags]
DYNASTYGM_PREMIUM_OVERRIDE = "false"
DYNASTYGM_DEBUG_AUTH = "false"
DYNASTYGM_DEBUG_PERF = "false"
DYNASTYGM_SHOW_EXPERIMENTAL = "false"
DYNASTYGM_SHOW_DEV_DESTINATIONS = "false"
