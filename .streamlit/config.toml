[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#050607"
secondaryBackgroundColor = "#0f1114"
textColor = "#f8fafc"
font = "sans serif"

[client]
# Supported Streamlit control: removes developer/deploy/share options before
# the DynastyGM production chrome layer reclaims the remaining empty header.
toolbarMode = "minimal"
# Never expose Streamlit internals, file paths, or tracebacks to customers.
showErrorDetails = "none"
