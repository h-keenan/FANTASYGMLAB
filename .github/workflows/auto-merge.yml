name: Trusted Delivery

on:
  workflow_run:
    workflows: ["Delivery Validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  deliver:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mark ready and deliver
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Prefer the workflow_run payload; fall back to branch/SHA lookup.
          # The actions/runs/{id}/pulls endpoint can 404 for workflow_run tokens,
          # and gh may print the JSON error body to stdout. Only accept digits.
          normalize_pr_number() {
            case "$1" in
              ''|*[!0-9]*) printf '' ;;
              *) printf '%s' "$1" ;;
            esac
          }

          pr_number=$(normalize_pr_number "$(
            gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/pulls" --jq '.[0].number // empty' 2>/dev/null || true
          )")
          if [ -z "$pr_number" ] && [ -n "$HEAD_BRANCH" ]; then
            pr_number=$(normalize_pr_number "$(
              gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --state open \
                --json number,headRefOid \
                --jq "[.[] | select(.headRefOid == \"$HEAD_SHA\") | .number][0] // .[0].number // empty"
            )")
          fi
          if [ -z "$pr_number" ] && [ -n "$HEAD_SHA" ]; then
            pr_number=$(normalize_pr_number "$(
              gh pr list --repo "$REPOSITORY" --state open --search "$HEAD_SHA" \
                --json number --jq '.[0].number // empty'
            )")
          fi
          if [ -z "$pr_number" ]; then
            echo "No pull request is associated with workflow run $RUN_ID (branch=$HEAD_BRANCH sha=$HEAD_SHA)"
            exit 1
          fi
          labels=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -Fxq "human-approval-required"; then
            echo "PR #$pr_number requires explicit human approval; leaving it open."
            exit 0
          fi
          is_draft=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$is_draft" = "true" ]; then
            gh pr ready "$pr_number" --repo "$REPOSITORY"
          fi
          # This repository does not currently expose GitHub's native auto-merge
          # setting. The trusted workflow only runs after Delivery Validation has
          # succeeded, so merge immediately with the repository's normal method.
          gh pr merge "$pr_number" --repo "$REPOSITORY" --merge
          gh pr view "$pr_number" --repo "$REPOSITORY" --json number,state,isDraft,mergedAt,mergeCommit,url
