name: Render Keep-Alive

# Render's free/sleeping instance types put a service to sleep after ~15
# minutes of no inbound traffic, causing a 10-30s cold start on the next
# request (see render.yaml's notes on fantasygm-lab and
# fantasygm-lab-mobile-api). The real fix is a paid always-on instance type,
# selected in Render's dashboard (not settable via Blueprint/render.yaml) —
# this workflow is a stopgap that keeps both services warm by pinging their
# health endpoints often enough that they never go idle long enough to sleep.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: web app
            url: https://app.fantasygmlab.com/_stcore/health
          - name: mobile api
            url: https://fantasygm-lab-mobile-api.onrender.com/health
    steps:
      - name: Ping ${{ matrix.target.name }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "${{ matrix.target.url }}")
          echo "status=$code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::warning::${{ matrix.target.name }} health check returned $code"
          fi
