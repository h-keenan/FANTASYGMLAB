name: Deploy Supabase Edge Functions

# Deploys the billing Edge Functions in supabase/functions/ to the production
# Supabase project, so nobody has to run `supabase functions deploy` by hand.
#
# - workflow_dispatch only: deploy one named function, or all of them.
#   (The changed-files logic below is kept for a future push trigger.)
# - verify_jwt comes from supabase/config.toml per function. Functions set to
#   `verify_jwt = false` there (the provider webhooks and the public plans
#   endpoint) are deployed with --no-verify-jwt.
# - --use-api bundles on Supabase's side, so the runner needs no Docker.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from
#                          supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the project ref (the id in the dashboard URL)
# If either is missing the job logs a notice and exits successfully, so a
# fork or an unconfigured repo never goes red.
#
# Function secrets (STRIPE_*, REVENUECAT_*, ...) are NOT touched here; they
# stay in Supabase (`supabase secrets set`), set by hand.

# MANUAL ONLY. Production deploys go through Supabase's GitHub deployment
# integration; an automatic push trigger here could race it. Use this as a
# fallback from the Actions tab. Do not add a `push` trigger without first
# confirming the integration does not also deploy on merge.
on:
  workflow_dispatch:
    inputs:
      function:
        description: "Function folder to deploy, or 'all'"
        required: true
        default: "all"

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set; skipping Edge Function deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Pick functions to deploy
        id: pick
        if: steps.secrets.outputs.ready == 'true'
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FUNCTION: ${{ github.event.inputs.function }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -exec basename {} \; | sort)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT_FUNCTION" = "all" ]; then
              list="$all"
            elif echo "$all" | grep -qx "$INPUT_FUNCTION"; then
              list="$INPUT_FUNCTION"
            else
              echo "::error::Unknown function '$INPUT_FUNCTION'. Known: $(echo $all)"
              exit 1
            fi
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              changed=$(git diff --name-only HEAD~1 "$AFTER")
            else
              changed=$(git diff --name-only "$BEFORE" "$AFTER")
            fi
            if echo "$changed" | grep -Eq '^supabase/functions/_|^supabase/config\.toml$'; then
              list="$all"
            else
              list=$(echo "$changed" | sed -n 's#^supabase/functions/\([^/_][^/]*\)/.*#\1#p' | sort -u | grep -Fx -f <(echo "$all") || true)
            fi
          fi
          list=$(echo $list)
          echo "Functions to deploy: ${list:-none}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true' && steps.pick.outputs.list != ''
        env:
          LIST: ${{ steps.pick.outputs.list }}
        run: |
          set -euo pipefail
          no_jwt() {
            # true when supabase/config.toml sets verify_jwt = false for this function
            awk -v fn="[functions.$1]" '
              $0 == fn { inside = 1; next }
              /^\[/ { inside = 0 }
              inside && $0 ~ /^verify_jwt[[:space:]]*=[[:space:]]*false/ { found = 1 }
              END { exit found ? 0 : 1 }
            ' supabase/config.toml
          }
          for fn in $LIST; do
            flags="--project-ref $SUPABASE_PROJECT_REF --use-api"
            if no_jwt "$fn"; then flags="$flags --no-verify-jwt"; fi
            echo "::group::deploy $fn ($flags)"
            npx --yes supabase@2.122.0 functions deploy "$fn" $flags
            echo "::endgroup::"
          done
