name: News Ingest

# Scheduled fetch of the existing publisher RSS feeds (modules.news.NEWS_FEEDS)
# into Supabase with revision history and per-source health. This is the only
# thing that fetches news for the external feed; GET /v1/external/news only
# reads. See modules/news_ingest.py and docs/supabase_news_items.sql (applied
# by hand in the Supabase SQL Editor; until it is, the job fails with exit 2).
#
# Required GitHub secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ingest news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest_news.py --require-durable
