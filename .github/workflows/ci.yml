name: Delivery Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mobile_app_changed: ${{ steps.classify.outputs.mobile_app_changed }}
      web_next_changed: ${{ steps.classify.outputs.web_next_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/classify_pr_changes.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q modules services scripts tests
      - name: Import production services
        run: python -c "import services.stripe_webhook_service; import services.revenuecat_webhook_service; import services.mobile_api_service"
      - name: Diff whitespace safety
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA"...HEAD
      - name: Data files sanity (sleeper_players.json is a real player map)
        run: python scripts/check_data_integrity.py
      - name: Full test suite
        run: python -m pytest -q -n auto --dist worksteal
      - name: Tests must not dirty tracked data files
        run: python scripts/check_data_integrity.py --check-clean
      - name: Benchmark public player cache
        run: python scripts/benchmark_public_player_cache.py

  billing-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Billing Edge Function tests
        run: deno test --no-lock supabase/functions/_shared/

  lib-twins:
    # Web and mobile each keep hand-maintained copies of the same pure-TS
    # libs; this fails when one side drifts. Runs for a change to either tree
    # (a mobile-only PR never starts the web-next job). No install needed.
    needs: [classify]
    if: needs.classify.outputs.mobile_app_changed == 'true' || needs.classify.outputs.web_next_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check web/mobile lib twins
        run: node scripts/check_lib_twins.mjs
      - name: Check every player and pick is tappable
        run: node scripts/check_player_tap.mjs
      - name: Check the one InfoMark standard
        run: node scripts/check_info_mark_usage.mjs

  mobile-app:
    needs: [classify]
    if: needs.classify.outputs.mobile_app_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Expo doctor
        run: |
          set +e
          output="$(npx expo-doctor 2>&1)"
          status=$?
          echo "$output"
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # ios/ is intentionally committed (as a bootstrap snapshot for Xcode
          # Cloud to detect a project/scheme) but is always regenerated fresh
          # via `expo prebuild --clean` before every real build — Fastlane's
          # ensure_native_project and mobile/ios/ci_scripts/ci_post_clone.sh
          # both do this. expo-doctor can't see that CI step, so it always
          # flags the committed folder; accept only this one known check.
          failed_checks="$(echo "$output" | grep -c '^✖')"
          if [ "$failed_checks" -eq 1 ] && echo "$output" | grep -q "Check for app config fields that may not be synced in a non-CNG project"; then
            echo "Accepting the known non-CNG-sync warning: ios/ is a bootstrap snapshot for Xcode Cloud, regenerated fresh before every real build."
            exit 0
          fi
          exit "$status"

  web-next:
    needs: [classify]
    if: needs.classify.outputs.web_next_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        # NEXT_PUBLIC_* only need to be set (not valid) for a CI build —
        # nothing calls Supabase/the API at build time, only at runtime.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
      - name: Perf budget (first-load JS per route, banned animated properties)
        # Reads .next/diagnostics/route-bundle-stats.json from the build above and scans CSS keyframes. Reports without
        # failing the job until the route budgets (web-next/perf-budget.json) have survived a few weeks of merges; then
        # delete continue-on-error. See docs/perf-budget.md.
        continue-on-error: true
        run: node ../scripts/perf/check_perf_budget.mjs

  route-overflow:
    # No main route may scroll sideways on a phone: loads every route at 390px (Chromium, mobile emulation) against the
    # dev server with the module-scan fixtures and fails when document.scrollWidth > innerWidth, naming the elements that
    # hold the too-wide content. The app shell's overflow-x: clip backstop is switched off while measuring, so the check
    # still catches the real bug. Local run: OVERFLOW=1 WIDTHS=390 node scripts/sim_layout_playwright/module_scan.mjs
    needs: [classify]
    if: needs.classify.outputs.web_next_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Install dependencies
        working-directory: web-next
        run: npm ci
      - name: Install Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.65.1
          npx playwright-core install --with-deps chromium
          echo "PW_CORE=$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
      - name: Start web-next dev server
        working-directory: web-next
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: x
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: |
          nohup npx next dev -p 3231 > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 1 90); do curl -s -o /dev/null -m 120 http://localhost:3231/news && break; sleep 2; done
      - name: No route scrolls sideways at 390px
        env:
          BROWSER: chromium
          BASE: http://localhost:3231
          OUT: ${{ runner.temp }}/route-overflow
          WIDTHS: "390"
          OVERFLOW: "1"
        run: node scripts/sim_layout_playwright/module_scan.mjs
      - name: Server log on failure
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/next.log" || true
