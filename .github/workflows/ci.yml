name: Delivery Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mobile_app_changed: ${{ steps.classify.outputs.mobile_app_changed }}
      web_next_changed: ${{ steps.classify.outputs.web_next_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/classify_pr_changes.py --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q modules services scripts tests
      - name: Import production services
        run: python -c "import services.stripe_webhook_service; import services.revenuecat_webhook_service; import services.mobile_api_service"
      - name: Diff whitespace safety
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA"...HEAD
      - name: Data files sanity (sleeper_players.json is a real player map)
        run: python scripts/check_data_integrity.py
      - name: Full test suite
        run: python -m pytest -q -n auto -m "not known_flaky"
      - name: Tests must not dirty tracked data files
        run: python scripts/check_data_integrity.py --check-clean
      # A small, STABLE set of pre-existing tests has failed intermittently
      # on main for a while, unrelated to whatever PR touched them (see
      # pytest.ini's own comment on the known_flaky marker). Runs separately
      # and non-blocking (continue-on-error) so a real regression in one of
      # these specific tests still shows up in the job output — never
      # silently discarded — it just doesn't gate the merge.
      - name: Known-flaky suite (non-blocking)
        continue-on-error: true
        run: python -m pytest -q -m known_flaky
      - name: Benchmark public player cache
        run: python scripts/benchmark_public_player_cache.py

  billing-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Billing Edge Function tests
        run: deno test --no-lock supabase/functions/_shared/

  mobile-app:
    needs: [classify]
    if: needs.classify.outputs.mobile_app_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Expo doctor
        run: |
          set +e
          output="$(npx expo-doctor 2>&1)"
          status=$?
          echo "$output"
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # ios/ is intentionally committed (as a bootstrap snapshot for Xcode
          # Cloud to detect a project/scheme) but is always regenerated fresh
          # via `expo prebuild --clean` before every real build — Fastlane's
          # ensure_native_project and mobile/ios/ci_scripts/ci_post_clone.sh
          # both do this. expo-doctor can't see that CI step, so it always
          # flags the committed folder; accept only this one known check.
          failed_checks="$(echo "$output" | grep -c '^✖')"
          if [ "$failed_checks" -eq 1 ] && echo "$output" | grep -q "Check for app config fields that may not be synced in a non-CNG project"; then
            echo "Accepting the known non-CNG-sync warning: ios/ is a bootstrap snapshot for Xcode Cloud, regenerated fresh before every real build."
            exit 0
          fi
          exit "$status"

  web-next:
    needs: [classify]
    if: needs.classify.outputs.web_next_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        # NEXT_PUBLIC_* only need to be set (not valid) for a CI build —
        # nothing calls Supabase/the API at build time, only at runtime.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
